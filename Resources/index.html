<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' starbud-asset: data:; media-src 'self'; connect-src 'none'"><title>QWhaleMaiden</title><link rel="stylesheet" href="pet.css"><link rel="stylesheet" href="app.css"></head>
<body class="pet-window"><div id="stage">
<section id="notice" hidden aria-label="提醒"><button id="noticeBody" title="前往来源应用"><span id="noticeSource"></span><strong id="noticeText"></strong></button><div class="notice-controls"><button id="prev" aria-label="上一条">‹</button><span id="position"></span><button id="next" aria-label="下一条">›</button><span class="spacer"></span><button id="ackReminder" hidden>知道啦</button><button id="later" title="30 分钟后再提醒">稍后</button><button id="dismiss" aria-label="收起提醒"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 2L10 10M10 2L2 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div></section>
<div id="localLine" hidden></div><div id="art" aria-label="DSH 蓝鲸娘"><img id="poster" src="dsh/poster.png" alt="蓝鲸娘"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video><div id="pet"></div></div><div id="customArt" hidden></div>
<div id="petMenu" hidden aria-label="快捷操作"><button id="focusToggle">开始番茄钟</button><button id="controlsButton" aria-haspopup="dialog" aria-expanded="false">更多</button></div>
<section id="morePanel" hidden role="dialog" aria-label="更多功能"><header><strong>更多</strong><button id="closeMore" aria-label="关闭更多"><svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 2L10 10M10 2L2 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header><nav role="tablist" aria-label="功能分类"><button role="tab" data-more-tab="interact" aria-selected="true">互动</button><button role="tab" data-more-tab="tools" aria-selected="false">工具</button><button role="tab" data-more-tab="manage" aria-selected="false">管理</button></nav>
<div data-more-page="interact" class="more-grid"><button data-pet="eat">喂食<span>来点小零食</span></button><button data-pet="play">玩耍<span>随机玩个游戏</span></button><button data-pet="walk">散步<span>出去走走</span></button><button data-pet="sleep" id="sleepToggle">打个盹<span>安静休息一会儿</span></button><button id="saySomething">说句话<span>换一句碎碎念</span></button><button data-open-tab="packs">换个形象<span>动作和本地素材</span></button></div>
<div data-more-page="tools" hidden><div class="mini-focus"><div id="miniFocusContent"><span id="miniFocusState">专注时间</span><strong id="miniClock">45:00</strong><div><button id="pauseQuick" data-quick-focus="pause">暂停</button><button data-quick-focus="break">休息 5 分钟</button></div></div><section id="miniWidgets" hidden aria-label="天气与今日日历"><div class="mini-weather"><strong id="miniWeatherSummary"></strong><small id="miniWeatherMeta"></small></div><button id="miniCalendar" title="打开 macOS 日历应用"><span id="miniCalendarDate"></span><div id="miniCalendarItems"></div></button><button id="inlineWidgetSettings" data-open-tab="widgets" hidden>设置城市与日历</button></section></div><div class="more-grid"><button id="toggleWidgets" aria-expanded="false">天气与日历</button><button id="focusSettings" data-open-tab="life">专注与休息</button></div></div>
<div data-more-page="manage" hidden><label><span>偶尔散步</span><input type="checkbox" data-pet-setting="walk"></label><label><span>离线碎碎念</span><input type="checkbox" data-pet-setting="whispers"></label><label><span>减少动态效果</span><input type="checkbox" data-pet-setting="reducedMotion"></label><div class="more-grid compact"><button data-control="quiet" id="quietQuick">勿扰 1 小时</button><button data-control="corner">召回桌宠</button><button data-control="hide">隐藏桌宠</button><button data-control="through">整窗穿透</button></div><footer><button data-open-tab="companion">完整设置</button><button data-control="quit" class="danger">退出桌宠</button></footer></div>
</section>
</div><script src="dsh/catalog.js"></script><script src="dsh-renderer.js"></script><script src="pet.js"></script></body></html>
